<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Singer Rhythm Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090817;font-family:Arial,sans-serif;color:#fff}button{font:inherit}
#game{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;background:#090817}
#stage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,3,18,.22),rgba(4,3,18,.03) 55%,rgba(4,3,18,.68));z-index:1;pointer-events:none}
#hud{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(94vw,1100px);display:flex;justify-content:space-between;align-items:center;z-index:30;text-shadow:0 3px 10px #000}.stat{font-weight:800;font-size:clamp(16px,2vw,25px);letter-spacing:.05em}.label{font-size:.58em;opacity:.75;display:block;letter-spacing:.14em}.value{display:block}
#timerWrap{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:min(70vw,760px);height:12px;border:2px solid rgba(255,255,255,.75);border-radius:20px;background:rgba(0,0,0,.3);overflow:hidden;z-index:30}.timerBar{height:100%;width:100%;background:linear-gradient(90deg,#f5c7ff,#a55cff);transform-origin:left center}
#singer{position:absolute;z-index:5;left:50%;bottom:22%;transform:translateX(-50%);height:min(62vh,700px);width:auto;max-width:48vw;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));transition:filter .15s,transform .15s}#singer.pulse{animation:singPulse .22s ease}@keyframes singPulse{50%{transform:translateX(-50%) translateY(-10px) scale(1.025)}}
.stageFlash{position:absolute;inset:0;z-index:25;pointer-events:none;background:rgba(255,255,255,0);animation:flash .35s ease}@keyframes flash{0%{background:rgba(255,255,255,.28)}100%{background:rgba(255,255,255,0)}}
#highway{position:absolute;z-index:8;left:50%;top:14%;bottom:17%;transform:translateX(-50%);width:min(48vw,560px);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1vw,12px);pointer-events:none}.lane{position:relative;height:100%;border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}#hitLine{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.75);box-shadow:0 0 18px rgba(255,255,255,.65);z-index:2}.fallingNote{position:absolute;width:clamp(58px,6vw,82px);height:clamp(58px,6vw,82px);padding:3px;left:50%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 5px 10px rgba(0,0,0,.55));will-change:top,transform}.fallingNote img{width:100%;height:100%;object-fit:contain}.fallingNote.near{filter:drop-shadow(0 0 18px rgba(255,255,255,.95))}
#notes{position:absolute;z-index:20;left:50%;bottom:5%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,1.2vw,18px);width:min(48vw,560px)}.noteBtn{width:100%;aspect-ratio:1;padding:8px;border:2px solid rgba(255,255,255,.65);border-radius:22px;background:rgba(20,14,42,.82);box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 20px rgba(255,255,255,.08);cursor:pointer;touch-action:manipulation;transition:.1s}.noteBtn img{width:100%;height:100%;object-fit:contain}.noteBtn.hit{transform:scale(.9)}
#combo{position:absolute;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);font-size:clamp(14px,2vw,22px);font-weight:900;letter-spacing:.12em;text-shadow:0 3px 10px #000}.comboNum{font-size:1.5em}
#reactionBox{position:absolute;z-index:28;left:calc(50% + min(25vw,300px));top:42%;width:clamp(140px,15vw,210px);text-align:center;opacity:0;transform:translateX(18px) scale(.92);pointer-events:none;transition:opacity .25s ease,transform .25s ease}#reactionBox.show{opacity:1;transform:translateX(0) scale(1)}#reactionImage{width:100%;height:clamp(150px,18vw,220px);object-fit:contain;display:block;filter:drop-shadow(0 8px 15px rgba(0,0,0,.45))}#reactionBanner{width:100%;height:auto;max-height:65px;object-fit:contain;display:block;margin-top:-8px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.55))}#reactionPoints{font-size:clamp(15px,2vw,24px);font-weight:900;text-shadow:0 3px 10px #000;margin-top:2px}
#start,#result{position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,20,.72);backdrop-filter:blur(5px)}.panel{width:min(90vw,560px);padding:38px 30px;text-align:center;border:1px solid rgba(255,255,255,.3);border-radius:28px;background:rgba(17,11,43,.9);box-shadow:0 20px 70px rgba(0,0,0,.55)}h1{margin:0 0 12px;font-size:clamp(32px,6vw,58px)}p{opacity:.85;line-height:1.5}.mainBtn{margin-top:18px;padding:15px 34px;border:0;border-radius:999px;background:linear-gradient(135deg,#dca8ff,#8754ff);color:#fff;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 8px 25px rgba(120,70,255,.35)}#result{display:none}.resultSinger{height:320px;max-width:80%;object-fit:contain;display:block;margin:0 auto 8px}.scoreBig{font-size:38px;font-weight:1000}.rating{font-size:22px;margin-top:6px;font-weight:800}.hidden{display:none!important}
@media(max-width:800px){#hud{top:10px}.stat{font-size:15px}#timerWrap{top:58px;width:82vw;height:9px}#singer{height:51vh;max-width:70vw;bottom:25%}#highway{width:min(78vw,560px);top:15%;bottom:20%}#notes{width:min(78vw,560px);bottom:7%}.noteBtn{border-radius:16px;padding:6px}#reactionBox{left:auto;right:2%;top:39%;width:clamp(110px,24vw,170px)}#reactionImage{height:clamp(115px,25vw,170px)}#reactionBanner{max-height:48px}#combo{bottom:2px}}@media(max-width:520px){#singer{height:47vh;bottom:27%;max-width:62vw}#highway{width:92vw;top:15%;bottom:21%}#notes{width:92vw}.fallingNote{width:52px;height:52px}#reactionBox{right:1%;top:42%;width:112px}#reactionImage{height:118px}#reactionBanner{max-height:35px}}
</style>
</head>
<body>
<div id="game"><img id="stage" src="assets/background/cover-scene.png" alt="Сцена"><div id="shade"></div>
<div id="hud"><div class="stat"><span class="label">СЧЁТ</span><span id="score" class="value">0</span></div><div class="stat" style="text-align:right"><span class="label">ВРЕМЯ</span><span id="time" class="value">30</span></div></div><div id="timerWrap"><div id="timerBar" class="timerBar"></div></div>
<img id="singer" src="assets/singer/sing-1.png" alt="Певец"><div id="highway"><div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div><div id="hitLine"></div></div>
<div id="reactionBox"><img id="reactionImage" src="assets/singer/perfect-reaction.png" alt="Реакция"><img id="reactionBanner" src="assets/effects/greatt-banner.png" alt="Оценка"><div id="reactionPoints">+100</div></div><div id="notes"></div><div id="combo">COMBO <span id="comboNum" class="comboNum">0</span></div>
<div id="start"><div class="panel"><h1>🎤 ВЫСТУПЛЕНИЕ</h1><p>Ноты падают сверху. Нажимай нужную стрелку,<br>когда нота касается линии попадания.</p><button id="startBtn" class="mainBtn">НАЧАТЬ</button></div></div>
<div id="result"><div class="panel"><img id="resultSinger" class="resultSinger" src="assets/singer/not_bad_ending.png" alt="Результат"><h1 id="resultTitle">Выступление окончено!</h1><div class="scoreBig" id="finalScore">0</div><div class="rating" id="rating">Неплохо!</div><button id="restartBtn" class="mainBtn">ИГРАТЬ ЕЩЁ РАЗ</button></div></div></div>
<script>
const singer=document.getElementById('singer'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('comboNum'),timerBar=document.getElementById('timerBar');
const reactionBox=document.getElementById('reactionBox'),reactionImage=document.getElementById('reactionImage'),reactionBanner=document.getElementById('reactionBanner'),reactionPoints=document.getElementById('reactionPoints'),notesEl=document.getElementById('notes'),start=document.getElementById('start'),result=document.getElementById('result'),highway=document.getElementById('highway');
const resultSinger=document.getElementById('resultSinger'),finalScore=document.getElementById('finalScore'),rating=document.getElementById('rating'),resultTitle=document.getElementById('resultTitle');
const keys=['ArrowLeft','ArrowUp','ArrowDown','ArrowRight'],images={ArrowLeft:'assets/effects/arrow-left.png',ArrowUp:'assets/effects/arrow-up.png',ArrowDown:'assets/effects/arrow-down.png',ArrowRight:'assets/effects/arrow-right.png'};
const sing=['assets/singer/sing-1.png','assets/singer/sing-2.png','assets/singer/sing-3.png','assets/singer/sing-4.png','assets/singer/sing-5.png','assets/singer/sing-6.png'];
const reactions={PERFECT:{image:'assets/singer/perfect-reaction.png',banner:'assets/effects/greatt-banner.png',points:'+100'},GOOD:{image:'assets/singer/good-reaction.png',banner:'assets/effects/good-banner.png',points:'+70'},OK:{image:'assets/singer/ok-reaction.png',banner:'assets/effects/good-banner.png',points:'+30'},MISS:{image:'assets/singer/miss-reaction.png',banner:'assets/effects/miss-banner.png',points:'+0'}};
let score=0,combo=0,playing=false,startTime=0,animId=null,frame=0,lastFrame=0,lastSpawn=0,reactionTimer=null,notes=[];
const GAME_TIME=30,FALL_TIME=1450,HIT_WINDOW=135,SPAWN_INTERVAL=650,SINGER_FRAME_MIN=260,SINGER_FRAME_MAX=390;
function buildButtons(){notesEl.innerHTML='';keys.forEach(key=>{const b=document.createElement('button');b.className='noteBtn';b.dataset.key=key;const img=document.createElement('img');img.src=images[key];b.appendChild(img);b.addEventListener('pointerdown',e=>{e.preventDefault();attempt(key)});notesEl.appendChild(b)})}
function laneIndex(key){return keys.indexOf(key)}
function spawnNote(now){if(!playing)return;const key=keys[Math.floor(Math.random()*keys.length)],lane=document.querySelector(`.lane[data-lane="${laneIndex(key)}"]`),el=document.createElement('div');el.className='fallingNote';const img=document.createElement('img');img.src=images[key];el.appendChild(img);lane.appendChild(el);notes.push({el,key,spawned:now,hit:false})}
function noteProgress(n,now){return Math.min(1,(now-n.spawned)/FALL_TIME)}
function noteY(n,now){const h=highway.clientHeight,nh=n.el.offsetHeight,startY=-nh,targetY=h-nh/2-2;return startY+(targetY-startY)*noteProgress(n,now)}
function updateNotes(now){for(let i=notes.length-1;i>=0;i--){const n=notes[i];if(n.hit){n.el.remove();notes.splice(i,1);continue}const p=noteProgress(n,now);n.el.style.top=`${noteY(n,now)}px`;if(p>.86)n.el.classList.add('near');else n.el.classList.remove('near');if(p>=1){n.el.remove();notes.splice(i,1);miss()}}}
function nearestNote(key,now){let best=null,d=Infinity;for(const n of notes){if(n.hit||n.key!==key)continue;const dist=Math.abs(noteProgress(n,now)-1);if(dist<d){d=dist;best=n}}return best}
function attempt(key){if(!playing)return;const now=performance.now(),n=nearestNote(key,now);if(!n){miss();return}const delta=Math.abs((noteProgress(n,now)-1)*FALL_TIME);if(delta>HIT_WINDOW){miss();return}n.hit=true;const b=document.querySelector(`.noteBtn[data-key="${key}"]`);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),100);if(delta<=55){score+=100;combo++;showReaction('PERFECT')}else if(delta<=95){score+=70;combo++;showReaction('GOOD')}else{score+=30;combo++;showReaction('OK')}pulse();updateHud()}
function miss(){if(!playing)return;combo=0;showReaction('MISS');pulse(true);updateHud()}
function showReaction(type){const r=reactions[type];reactionImage.src=r.image;reactionBanner.src=r.banner;reactionPoints.textContent=r.points;reactionBox.classList.remove('show');void reactionBox.offsetWidth;reactionBox.classList.add('show');clearTimeout(reactionTimer);reactionTimer=setTimeout(()=>reactionBox.classList.remove('show'),type==='MISS'?1200:900)}
function updateHud(){scoreEl.textContent=score.toLocaleString('ru-RU');comboEl.textContent=combo}
function pulse(bad=false){singer.classList.remove('pulse');void singer.offsetWidth;singer.classList.add('pulse');if(bad){const f=document.createElement('div');f.className='stageFlash';document.getElementById('game').appendChild(f);setTimeout(()=>f.remove(),350)}}
function nextSingerFrame(now){let next=lastFrame+(SINGER_FRAME_MIN+Math.random()*(SINGER_FRAME_MAX-SINGER_FRAME_MIN));if(now>=next){frame=Math.floor(Math.random()*sing.length);singer.src=sing[frame];lastFrame=now}}
function animateSinger(now){if(!playing)return;nextSingerFrame(now);if(now-lastSpawn>=SPAWN_INTERVAL){spawnNote(now);lastSpawn=now}updateNotes(now);animId=requestAnimationFrame(animateSinger)}
function tick(){const elapsed=(performance.now()-startTime)/1000,left=Math.max(0,GAME_TIME-elapsed);timeEl.textContent=Math.ceil(left);timerBar.style.transform=`scaleX(${left/GAME_TIME})`;if(left<=0){endGame();return}requestAnimationFrame(tick)}
function startGame(){score=0;combo=0;frame=Math.floor(Math.random()*sing.length);playing=true;start.style.display='none';result.style.display='none';reactionBox.classList.remove('show');scoreEl.textContent='0';comboEl.textContent='0';timeEl.textContent=GAME_TIME;singer.src=sing[frame];startTime=performance.now();lastFrame=startTime;lastSpawn=startTime-300;notes.forEach(n=>n.el.remove());notes=[];cancelAnimationFrame(animId);animId=requestAnimationFrame(animateSinger);requestAnimationFrame(tick)}
function endGame(){playing=false;cancelAnimationFrame(animId);notes.forEach(n=>n.el.remove());notes=[];finalScore.textContent=score.toLocaleString('ru-RU');if(score>=2300){resultTitle.textContent='ВОТ ЭТО ВЫСТУПЛЕНИЕ!';rating.textContent='S — Певец в восторге!';resultSinger.src='assets/singer/happy_ending.png'}else if(score>=1500){resultTitle.textContent='Очень неплохо!';rating.textContent='A — Отличное выступление';resultSinger.src='assets/singer/not_bad_ending.png'}else{resultTitle.textContent='Надо было постараться...';rating.textContent='C — Певец расстроен';resultSinger.src='assets/singer/bad_ending.png'}result.style.display='flex'}
document.addEventListener('keydown',e=>{if(keys.includes(e.key)){e.preventDefault();attempt(e.key)}});document.getElementById('startBtn').addEventListener('click',startGame);document.getElementById('restartBtn').addEventListener('click',startGame);buildButtons();
</script></body></html>
