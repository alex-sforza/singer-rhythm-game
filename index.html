<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Singer Rhythm Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090817;font-family:Arial,sans-serif;color:#fff}button{font:inherit}
#game{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;background:#090817}
#stage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,3,18,.25),rgba(4,3,18,.05) 55%,rgba(4,3,18,.65));z-index:1;pointer-events:none}
#hud{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(94vw,1100px);display:flex;justify-content:space-between;align-items:center;z-index:10;text-shadow:0 3px 10px #000}
.stat{font-weight:800;font-size:clamp(16px,2vw,25px);letter-spacing:.05em}.label{font-size:.58em;opacity:.75;display:block;letter-spacing:.14em}.value{display:block}
#timerWrap{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:min(70vw,760px);height:12px;border:2px solid rgba(255,255,255,.75);border-radius:20px;background:rgba(0,0,0,.3);overflow:hidden;z-index:10}.timerBar{height:100%;width:100%;background:linear-gradient(90deg,#f5c7ff,#a55cff);transform-origin:left center}
#singer{position:absolute;z-index:5;left:50%;bottom:18%;transform:translateX(-50%);height:min(62vh,700px);width:auto;max-width:48vw;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));transition:filter .15s,transform .15s}
#singer.pulse{animation:singPulse .22s ease}.stageFlash{position:absolute;inset:0;z-index:6;pointer-events:none;background:rgba(255,255,255,0);animation:flash .35s ease}
@keyframes singPulse{50%{transform:translateX(-50%) translateY(-10px) scale(1.025)}}@keyframes flash{0%{background:rgba(255,255,255,.3)}100%{background:rgba(255,255,255,0)}}
#judgement{position:absolute;z-index:20;left:calc(50% + min(20vw,260px));top:43%;min-width:180px;text-align:left;opacity:0;transform:translateY(15px) scale(.8);pointer-events:none;text-shadow:0 4px 14px #000;transition:.2s}.jText{font-size:clamp(30px,5vw,64px);font-weight:1000;font-style:italic;letter-spacing:.03em}.points{font-size:clamp(18px,2.5vw,30px);font-weight:800}.show{opacity:1;transform:translateY(0) scale(1)}
#notes{position:absolute;z-index:9;left:50%;bottom:5%;transform:translateX(-50%);display:flex;gap:clamp(7px,1.2vw,18px);align-items:center}
.noteBtn{width:clamp(66px,8vw,100px);height:clamp(66px,8vw,100px);padding:8px;border:2px solid rgba(255,255,255,.65);border-radius:22px;background:rgba(20,14,42,.78);box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 20px rgba(255,255,255,.08);cursor:pointer;touch-action:manipulation;transition:.12s}.noteBtn img{width:100%;height:100%;object-fit:contain}.noteBtn.active{transform:translateY(-8px) scale(1.12);border-color:#fff;box-shadow:0 0 30px rgba(255,214,255,.9),0 10px 30px rgba(0,0,0,.5)}.noteBtn.hit{transform:scale(.9)}
#combo{position:absolute;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);font-size:clamp(14px,2vw,22px);font-weight:900;letter-spacing:.12em;text-shadow:0 3px 10px #000}.comboNum{font-size:1.5em}
#start,#result{position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,20,.72);backdrop-filter:blur(5px)}.panel{width:min(90vw,560px);padding:38px 30px;text-align:center;border:1px solid rgba(255,255,255,.3);border-radius:28px;background:rgba(17,11,43,.9);box-shadow:0 20px 70px rgba(0,0,0,.55)}h1{margin:0 0 12px;font-size:clamp(32px,6vw,58px)}p{opacity:.85;line-height:1.5}.mainBtn{margin-top:18px;padding:15px 34px;border:0;border-radius:999px;background:linear-gradient(135deg,#dca8ff,#8754ff);color:#fff;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 8px 25px rgba(120,70,255,.35)}
#result{display:none}.resultSinger{height:320px;max-width:80%;object-fit:contain;display:block;margin:0 auto 8px}.scoreBig{font-size:38px;font-weight:1000}.rating{font-size:22px;margin-top:6px;font-weight:800}
.hidden{display:none!important}
@media(max-width:650px){#hud{top:10px}.stat{font-size:15px}#timerWrap{top:58px;width:82vw;height:9px}#singer{height:53vh;max-width:72vw;bottom:22%}#judgement{left:auto;right:5%;top:42%;min-width:0;text-align:right}.noteBtn{border-radius:16px;padding:6px}#notes{bottom:7%;width:94vw;justify-content:center}.combo{bottom:2px}}
</style>
</head>
<body>
<div id="game">
<img id="stage" src="assets/background/cover-scene.png" alt="Сцена"><div id="shade"></div>
<div id="hud"><div class="stat"><span class="label">СЧЁТ</span><span id="score" class="value">0</span></div><div class="stat" style="text-align:right"><span class="label">ВРЕМЯ</span><span id="time" class="value">30</span></div></div>
<div id="timerWrap"><div id="timerBar" class="timerBar"></div></div>
<img id="singer" src="assets/singer/sing-1.png" alt="Певец">
<div id="judgement"><div id="jText" class="jText">PERFECT!</div><div id="jPoints" class="points">+100</div></div>
<div id="notes"></div><div id="combo">COMBO <span id="comboNum" class="comboNum">0</span></div>
<div id="start"><div class="panel"><h1>🎤 ВЫСТУПЛЕНИЕ</h1><p>Нажимай нужную стрелку в правильный момент.<br>Попадай точно — и помоги певцу устроить идеальное шоу!</p><button id="startBtn" class="mainBtn">НАЧАТЬ</button></div></div>
<div id="result"><div class="panel"><img id="resultSinger" class="resultSinger" src="assets/singer/not_bad_ending.png" alt="Результат"><h1 id="resultTitle">Выступление окончено!</h1><div class="scoreBig" id="finalScore">0</div><div class="rating" id="rating">Неплохо!</div><button id="restartBtn" class="mainBtn">ИГРАТЬ ЕЩЁ РАЗ</button></div></div>
</div>
<script>
const singer=document.getElementById('singer');
const scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), comboEl=document.getElementById('comboNum'), timerBar=document.getElementById('timerBar');
const judgement=document.getElementById('judgement'),jText=document.getElementById('jText'),jPoints=document.getElementById('jPoints');
const notesEl=document.getElementById('notes'),start=document.getElementById('start'),result=document.getElementById('result');
const resultSinger=document.getElementById('resultSinger'),finalScore=document.getElementById('finalScore'),rating=document.getElementById('rating'),resultTitle=document.getElementById('resultTitle');
const keys=['ArrowLeft','ArrowUp','ArrowDown','ArrowRight'];
const images={ArrowLeft:'assets/effects/arrow-left.png',ArrowUp:'assets/effects/arrow-up.png',ArrowDown:'assets/effects/arrow-down.png',ArrowRight:'assets/effects/arrow-right.png'};
const sing=['assets/singer/sing-1.png','assets/singer/sing-2.png','assets/singer/sing-3.png','assets/singer/sing-4.png','assets/singer/sing-5.png','assets/singer/sing-6.png'];
const reactions={perfect:'assets/singer/perfect-reaction.png',good:'assets/singer/good-reaction.png',ok:'assets/singer/ok-reaction.png',miss:'assets/singer/miss-reaction.png'};
let score=0,combo=0,currentKey=null,activeSince=0,playing=false,startTime=0,timerId=null,animId=null,frame=0,lastFrame=0;
const GAME_TIME=30, HIT_WINDOW=650;
function buildButtons(){notesEl.innerHTML='';keys.forEach(key=>{const b=document.createElement('button');b.className='noteBtn';b.dataset.key=key;const img=document.createElement('img');img.src=images[key];b.appendChild(img);b.addEventListener('pointerdown',e=>{e.preventDefault();attempt(key)});notesEl.appendChild(b)})}
function chooseKey(){if(!playing)return;currentKey=keys[Math.floor(Math.random()*keys.length)];activeSince=performance.now();document.querySelectorAll('.noteBtn').forEach(b=>b.classList.toggle('active',b.dataset.key===currentKey));}
function attempt(key){if(!playing)return;const now=performance.now();if(key!==currentKey){miss();return}const delta=now-activeSince; if(delta<180){miss();return}let type,pts;if(delta<=350){type='PERFECT';pts=100}else if(delta<=HIT_WINDOW){type='GOOD';pts=70}else{miss();return}score+=pts;combo++;showJudgement(type,'+'+pts);react(type.toLowerCase());pulse();chooseKey()}
function miss(){combo=0;showJudgement('MISS','+0');react('miss');pulse(true);chooseKey()}
function showJudgement(type,pts){jText.textContent=type;jPoints.textContent=pts;judgement.classList.remove('show');void judgement.offsetWidth;judgement.classList.add('show');setTimeout(()=>judgement.classList.remove('show'),480);scoreEl.textContent=score.toLocaleString('ru-RU');comboEl.textContent=combo}
function react(type){const src=reactions[type]||reactions.miss;singer.dataset.normal=singer.src;singer.src=src;setTimeout(()=>{if(playing)singer.src=sing[frame%sing.length]},type==='miss'?450:300)}
function pulse(bad=false){singer.classList.remove('pulse');void singer.offsetWidth;singer.classList.add('pulse');if(bad){const f=document.createElement('div');f.className='stageFlash';document.getElementById('game').appendChild(f);setTimeout(()=>f.remove(),350)}}
function animateSinger(t){if(!playing)return;if(t-lastFrame>135){frame=(frame+1)%sing.length; if(!singer.src.includes('-reaction')) singer.src=sing[frame];lastFrame=t}animId=requestAnimationFrame(animateSinger)}
function tick(){const elapsed=(performance.now()-startTime)/1000;const left=Math.max(0,GAME_TIME-elapsed);timeEl.textContent=Math.ceil(left);timerBar.style.transform=`scaleX(${left/GAME_TIME})`;if(left<=0){endGame();return}timerId=requestAnimationFrame(tick)}
function startGame(){score=0;combo=0;frame=0;playing=true;start.style.display='none';result.style.display='none';scoreEl.textContent='0';comboEl.textContent='0';singer.src=sing[0];startTime=performance.now();lastFrame=startTime;chooseKey();requestAnimationFrame(animateSinger);requestAnimationFrame(tick)}
function endGame(){playing=false;cancelAnimationFrame(timerId);cancelAnimationFrame(animId);currentKey=null;document.querySelectorAll('.noteBtn').forEach(b=>b.classList.remove('active'));timerBar.style.transform='scaleX(0)';finalScore.textContent=score.toLocaleString('ru-RU');let pct=score/((GAME_TIME*100)/0.8);if(score>=2300){resultTitle.textContent='ВОТ ЭТО ВЫСТУПЛЕНИЕ!';rating.textContent='S — Певец в восторге!';resultSinger.src='assets/singer/happy_ending.png'}else if(score>=1500){resultTitle.textContent='Очень неплохо!';rating.textContent='A — Отличное выступление';resultSinger.src='assets/singer/not_bad_ending.png'}else{resultTitle.textContent='Надо было постараться...';rating.textContent='C — Певец расстроен';resultSinger.src='assets/singer/bad_ending.png'}result.style.display='flex'}
document.addEventListener('keydown',e=>{if(keys.includes(e.key)){e.preventDefault();attempt(e.key)}});
document.getElementById('startBtn').addEventListener('click',startGame);document.getElementById('restartBtn').addEventListener('click',startGame);buildButtons();
</script>
</body></html>
